version: '3.8'

services:
  redis:
    image: redis:latest
    env_file: 
      - stack.env
    volumes:
      - ./data/redis:/data
    restart: always
    networks:
      - internal_network

  postgres:
    image: postgres:18
    env_file: 
      - stack.env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: always
    networks:
      - internal_network

  telegram-bili-feed-helper:
    # 由本仓库 Actions 构建并发布到仓库所属账号
    image: ghcr.io/krau/telegram-bili-feed-helper:master
    depends_on:
      - redis
      - postgres
    env_file: 
      - stack.env
    volumes:
      - ./data/telegram:/data
    restart: always
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
